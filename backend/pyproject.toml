# Tooling and packaging metadata for the backend service.
#
# Dependencies are declared twice on purpose: `requirements*.txt` is what we
# install locally, and Vercel's Python builder prefers `pyproject.toml` when a
# project has both files and no lockfile — with no `[project]` table there it
# installs nothing and every request 500s. Keeping the same list in both places
# means either code path produces a working deployment. Keep them in step.
# Background: https://github.com/vercel/vercel/issues/14041

[project]
name = "creditmate-api"
version = "0.1.0"
description = "CreditMate FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "supabase>=2.9,<3.0",
    "httpx>=0.27,<1.0",
    "python-multipart>=0.0.9,<0.1",
    "openai>=1.50,<3.0",
]

[tool.uv]
# The API is served from this source tree (`app.main:app`) and never installed
# as a wheel, so uv must install the dependencies only, not build this project.
package = false

[tool.pytest.ini_options]
# Make `app` importable when pytest runs from `backend/`.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
# Keep in sync with the interpreter used for the backend venv.
target-version = "py312"
line-length = 100
src = ["app", "tests"]
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection uses `Depends(...)` in argument defaults by design.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]

